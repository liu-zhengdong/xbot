name: release

# On a v* tag: build the desktop packages (the same set scripts/package-desktop.sh
# makes by hand) and publish them as a GitHub prerelease. Uses only GITHUB_TOKEN.
# Builds are unsigned (macOS ad-hoc signature, Windows unsigned); INSTALL.md says
# how to let them run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      RCODESIGN_VERSION: "0.29.0"
      RCODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: packaging tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q genisoimage zip nsis
          go install github.com/tc-hib/go-winres@v0.3.3
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          name="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$tools/rcodesign.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${name}.tar.gz"
          echo "${RCODESIGN_SHA256}  $tools/rcodesign.tar.gz" | sha256sum -c -
          tar -C "$tools" -xzf "$tools/rcodesign.tar.gz"
          echo "RCODESIGN=$tools/$name/rcodesign" >> "$GITHUB_ENV"
          echo "GO_WINRES=$(go env GOPATH)/bin/go-winres" >> "$GITHUB_ENV"
      # Tags are cut from main, where ci.yml already ran vet and the tests.
      - name: vet
        run: go vet ./...
      - name: package
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/package-desktop.sh "$TAG" dist
      - name: check the package set
        run: |
          short="${TAG#v}"
          cd dist
          for f in \
            "XBot-$short-macos-arm64.dmg" "XBot-$short-macos-arm64.zip" \
            "XBot-$short-macos-amd64.dmg" "XBot-$short-macos-amd64.zip" \
            "XBot-$short-windows-amd64-setup.exe" "XBot-$short-windows-arm64-setup.exe" \
            "XBot-$short-windows-amd64.zip" "XBot-$short-windows-arm64.zip" \
            "xbot-$short-linux-amd64.tar.gz" SHA256SUMS; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          sha256sum -c SHA256SUMS
          cp ../packaging/INSTALL.md INSTALL.md
      - name: release notes
        run: |
          mkdir -p notes
          notes="packaging/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            cp "$notes" notes/notes.md
          else
            prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            {
              echo "XBot 桌面版 $TAG（预发布）"
              echo
              echo "安装和第一次打开的放行步骤见附件 INSTALL.md。安装包没有开发者签名。"
              echo
              echo "本版合并的改动："
              git log --format='- %s' ${prev:+"$prev..$TAG"}
            } > notes/notes.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes/notes.md

  # Install, upgrade and uninstall the real Setup.exe on Windows and check that
  # no environment variable changed, before anything is published.
  windows-installer:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: install, upgrade, uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Setup "dist/XBot-$("${{ github.ref_name }}".TrimStart('v'))-windows-amd64-setup.exe"

  # Rebuild the disk images as drag-to-Applications windows with a background.
  # dmgbuild needs hdiutil, so this runs on macOS.
  macos-dmg:
    needs: package
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: dmgbuild
        run: python3 -m pip install --user --break-system-packages dmgbuild==1.6.7
      - name: build and check the disk images
        run: bash scripts/build-macos-dmg.sh dist "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs: [package, windows-installer, macos-dmg]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes
      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dist
      - name: checksums
        run: |
          cd dist
          sha256sum XBot-* xbot-* > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 9
          sha256sum -c SHA256SUMS
      - name: publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease --verify-tag \
            --title "XBot $TAG" \
            --notes-file notes/notes.md
