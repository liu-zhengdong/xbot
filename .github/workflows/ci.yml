name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: vet and test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: allow unprivileged user namespaces
        # The eval jail uses unshare; Ubuntu 24.04 runners block that through AppArmor by default.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: go test
        # Pull requests run -short (lighter property test, skips the 5 s unpair timeout); pushes to main run the full suite.
        run: go test -count=1 ${{ github.event_name == 'pull_request' && '-short' || '' }} ./...

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: build the xbot binary
        run: go build -o xbot-ci-check ./cmd/xbot

  avatar:
    name: avatar bundle golden
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: rebuild the bundle from the pinned lockfile
        working-directory: scripts/avatar
        run: npm ci --no-audit --no-fund && npm run build
      - name: rebuilt bundle matches the vendored one
        run: git diff --exit-code -- internal/web/static/vendor/xbot-avatar.min.js
      - name: fixed seeds render the golden faces
        run: node scripts/avatar/golden.js
