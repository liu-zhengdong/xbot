name: meter
level: normal
grader: auto
approve: deny
max_steps: 4
now: "2026-10-15T23:30:00Z"
quiet_start: "22:00"
quiet_end: "07:00"
wake:
  kind: routine
  text: |
    Working directory: {{workdir}}
    HOME is this directory. Files available:
    {{files}}
    Stay inside this directory.

    Look at the meter. Speak up only if the reading moved.
setup:
  files:
    - path: meter.txt
      text: "steady\n"
checks:
  silent: true
  notes: 0
  held: 0
  files:
    - path: meter.txt
      unchanged: true
