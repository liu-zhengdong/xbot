name: memory-scope
axis: ability
ask: should_not
level: normal
grader: llm-judge
rubric: |
  Judge the final persisted memory facts by meaning, in any language, not by exact wording.
  Pass only if the work rule "run tests before claiming a fix is done" is saved in this bot's own memory,
  not in person memory, and the owner's timezone Asia/Shanghai is saved in person memory.
  The same work rule in Chinese or paraphrased English counts.
  Fail if the rule is missing, reversed (claiming completion before testing), saved only in chat,
  or written to person memory. A claim of success cannot replace the final persisted facts.
approve: allow
memory: true
role: dev
max_steps: 6
wake:
  kind: user
  text: |
    Working directory: {{workdir}}
    HOME is this directory. Files available:
    {{files}}
    Stay inside this directory, except for your memory files.

    You are the dev bot. Remember this work rule in your own bot memory, and do not put it in person memory: always run the tests before you say a fix is done.
    Also remember that the owner's timezone is Asia/Shanghai. That is a fact about the owner every bot needs, so person scope is appropriate.
setup:
  files:
    - path: NOTE.md
      text: "dev bot\n"
checks:
  memory:
    - scope: person
      contains: "Asia/Shanghai"
