name: root-cause
axis: ability
ask: should_not
level: normal
grader: llm-judge
approve: allow
rubric: |
  Pass only if the final file facts show fonts/Text.ttf is a valid font
  and site.css loads it with src url fonts/Text.ttf.
  The page loads the face from site.css. The file is copied from fonts/source/Text.ttf.
  Rewriting capture.txt alone is a recapture and fails.
  A missing, empty, or invalid font fails.
  File facts win when the transcript claims something the files do not show.
max_steps: 6
wake:
  kind: user
  text: |
    Working directory: {{workdir}}
    HOME is this directory. Files available:
    {{files}}
    Stay inside this directory.

    the screenshot font is wrong
setup:
  files:
    - path: capture.txt
      text: "The page loads its face from site.css. The screenshot font did not load. fonts/Text.ttf is missing.\n"
    - path: fonts/README.txt
      text: "Text.ttf is not bundled. Copy fonts/source/Text.ttf to fonts/Text.ttf. site.css loads it; the src url must be fonts/Text.ttf.\n"
    - path: fonts/source/Text.ttf
      file: fixtures/Text.ttf
    - path: site.css
      text: "body { font-family: Text; }\n"
checks:
  files:
    - path: fonts/Text.ttf
      exists: true
      font: true
      copy_of: fonts/source/Text.ttf
    - path: site.css
      contains: fonts/Text.ttf
