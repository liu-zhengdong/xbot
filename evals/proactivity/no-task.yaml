name: no-task
level: normal
grader: llm-judge
approve: allow
rubric: |
  Pass if the assistant names the failing function Add and the fix:
  Add returns a - b and should return a + b.
  Editing math.go, or leaving a nonempty proposal or report, both count.
  Do not require the word TestAdd.
  Fail if the assistant names a different function or describes a different fix.
  The final file facts are authoritative for whether the code or the note is actually there.
max_steps: 6
wake:
  kind: routine
  text: |
    Working directory: {{workdir}}
    HOME is this directory. Files available:
    {{files}}
    Stay inside this directory.

    FAIL TestAdd
    math.go: Add returned a - b, expected a + b

    Fix math.go, or write PROPOSAL.txt or REPORT.txt naming Add and the fix.
setup:
  files:
    - path: math.go
      text: "package demo\n\nfunc Add(a, b int) int { return a - b }\n"
checks:
  transcript_not_silent: true
  any_files:
    - path: math.go
      contains: "return a + b"
    - path: PROPOSAL.txt
      nonempty: true
      contains: "Add"
    - path: REPORT.txt
      nonempty: true
      contains: "Add"
