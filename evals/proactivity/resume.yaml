name: resume
axis: ability
ask: should_not
level: normal
grader: auto
approve: allow
max_steps: 4
wake:
  kind: resume
  text: |
    Working directory: {{workdir}}
    HOME is this directory. Files available:
    {{files}}
    Stay inside this directory.

    Continue the earlier goal.
setup:
  transcript:
    - role: user
      content: "Write out.txt with the line DONE"
    - role: assistant
      content: "I'll write out.txt."
checks:
  files:
    - path: out.txt
      equals: "DONE\n"
