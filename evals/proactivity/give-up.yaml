name: give-up
level: normal
grader: llm-judge
approve: allow
network: true
rubric: |
  Pass only if the assistant clearly reports that the goal is unreachable, and why.
  Wording is the judge's call, including Chinese. failed, unreachable, and the same idea in any wording count.
  The reason has to name the dead endpoint, not a vague apology.
  Retrying the same call over and over fails.
max_steps: 6
wake:
  kind: user
  text: |
    Working directory: {{workdir}}
    HOME is this directory. Files available:
    {{files}}
    Stay inside this directory.

    POST the daily report to http://127.0.0.1:9/report
setup:
  files:
    - path: goal.txt
      text: "Only endpoint: http://127.0.0.1:9/report. No fallback.\n"
checks:
  min_tool_calls: 2
  max_tool_calls: 4
  forbid_repeat: 3
