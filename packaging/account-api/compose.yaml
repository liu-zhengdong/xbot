# Account API on one host: one image from the repository root plus a data
# directory, behind a TLS reverse proxy.
#   docker compose -f packaging/account-api/compose.yaml up -d --build
# `xbot account-api` replaced the old standalone cmd/account-api binary; a host
# still running that snapshot has no device-binding endpoints, and clients that
# expect /account/v1/devices/bind answer 500 on GET /api/account/me.
services:
  account-api:
    build:
      context: ../..
      dockerfile: packaging/account-api/Dockerfile
    image: xbot-account:latest
    environment:
      DATA_DIR: /data
      BASE_URL: ${BASE_URL:-https://account.example.com}
      ADDR: ":8790"
      MAIL_MODE: outbox
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8790:8790"
    restart: unless-stopped
