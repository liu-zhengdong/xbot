# Place as /www/sites/gateway.babelgo.cn/proxy/root.conf (1Panel includes proxy/*.conf at server level).
location ^~ / {
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The gateway (--behind-proxy) trusts only the last X-Forwarded-For entry,
    # which $proxy_add_x_forwarded_for sets to the real client address.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    # Long polls wait up to 30 s (gateway MaxWait); leave headroom.
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    proxy_buffering off;
    # Envelopes are at most 64 KiB (gateway MaxBody); allow a little framing.
    client_max_body_size 80k;
}
