# gateway.babelgo.cn — HTTPS on 8443 (bypass Tencent ICP 80/443 intercept).
# :80 kept for ACME/local debug; public clients use :8443.
# Install as /opt/1panel/apps/openresty/openresty/conf/conf.d/gateway.babelgo.cn.conf
# Certs: /www/sites/gateway.babelgo.cn/ssl/{fullchain,privkey}.pem (LE via DNS-01)
server {
    listen 80;
    server_name gateway.babelgo.cn;
    access_log /www/sites/gateway.babelgo.cn/log/access.log main;
    error_log  /www/sites/gateway.babelgo.cn/log/error.log;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl http2;
    server_name gateway.babelgo.cn;
    access_log /www/sites/gateway.babelgo.cn/log/access.log main;
    error_log  /www/sites/gateway.babelgo.cn/log/error.log;

    ssl_certificate     /www/sites/gateway.babelgo.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/gateway.babelgo.cn/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # No HSTS: avoid forcing browsers onto blocked :443.
    error_page 497 https://$host:8443$request_uri;

    include /www/sites/gateway.babelgo.cn/proxy/*.conf;
}
