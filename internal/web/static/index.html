<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="theme-color">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>XBot</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="login" class="gate">
  <form id="login-form" class="gate-card">
    <div class="mark" aria-hidden="true">X</div>
    <h1>XBot</h1>
    <p class="muted">用这台机器上 <code>xbot serve</code> 打印的 token 登录。</p>
    <label class="field">
      <span>登录 token</span>
      <input id="token" name="token" type="password" autocomplete="current-password" required>
    </label>
    <p id="login-error" class="error" hidden></p>
    <button class="primary" type="submit">进入</button>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <button id="collapse" class="icon-btn" type="button" aria-label="收起列表" title="收起列表">
        <svg class="icon" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <span class="brand">XBot</span>
      <button id="new-bot" class="icon-btn" type="button" aria-label="新建 Bot" title="新建 Bot">
        <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      </button>
    </div>
    <div class="side-label">Bots</div>
    <nav id="bot-list" class="list"></nav>
    <div class="side-label row">
      <span>Groups</span>
      <button id="new-group" class="text-btn" type="button">新建</button>
    </div>
    <nav id="group-list" class="list"></nav>
    <div class="side-foot">
      <button id="theme" class="foot-btn" type="button">
        <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <span>外观</span>
      </button>
      <button id="logout" class="foot-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><path d="M21 12H9"/></svg>
        <span>退出</span>
      </button>
    </div>
  </aside>
  <div id="backdrop" class="backdrop" hidden></div>

  <main class="main">
    <header class="top">
      <button id="menu" class="icon-btn mobile-only" type="button" aria-label="打开列表">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
      </button>
      <div class="top-title">
        <div id="title" class="title">选择一个 Bot</div>
        <div id="subtitle" class="subtitle"></div>
      </div>
      <button id="bell" class="icon-btn" type="button" aria-label="通知">
        <svg class="icon" viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
        <i id="bell-dot" class="dot" hidden></i>
      </button>
      <button id="info" class="icon-btn" type="button" aria-label="详情">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      </button>
    </header>
    <div id="notes" class="notes" hidden></div>
    <div id="thread" class="thread"></div>
    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="写给这个 Bot" maxlength="16000"></textarea>
      <div class="composer-bar">
        <button class="icon-btn" type="button" disabled title="附件还没做">
          <svg class="icon" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <button class="icon-btn" type="button" disabled title="模式还没做">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></svg>
        </button>
        <button class="icon-btn" type="button" disabled title="语音还没做">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
        </button>
        <span class="spacer"></span>
        <button id="send" class="send" type="submit" aria-label="发送">
          <svg class="icon" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        </button>
      </div>
    </form>
  </main>

  <aside id="panel" class="panel" aria-label="详情">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="panel-head">
      <span>详情</span>
      <button id="panel-close" class="icon-btn" type="button" aria-label="关闭详情">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </aside>
</div>

<div id="modal" class="modal" hidden>
  <form id="modal-form" class="modal-card">
    <h2 id="modal-title">新建</h2>
    <div id="modal-fields"></div>
    <p id="modal-error" class="error" hidden></p>
    <div class="modal-actions">
      <button class="secondary" type="button" id="modal-cancel">取消</button>
      <button class="primary" type="submit" id="modal-ok">创建</button>
    </div>
  </form>
</div>
<script src="/app.js"></script>
</body>
</html>
