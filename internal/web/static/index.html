<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="theme-color">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
try {
  var t = localStorage.getItem("xbot-theme");
  if (t !== "light" && t !== "dark") {
    t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
  var m = document.getElementById("theme-color");
  if (m) m.setAttribute("content", t === "dark" ? "#161618" : "#ffffff");
} catch (e) {}
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>XBot</title>
<link rel="preload" href="/fonts/MonaSansVF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="login" class="gate">
  <form id="login-form" class="gate-card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 80 80"><path fill="#E4CDB8" d="M40 6C58 4 74 16 74 36C74 58 58 76 38 74C16 72 4 56 8 36C12 16 24 8 40 6Z"/><ellipse cx="30" cy="36" rx="3.4" ry="4" fill="#3A342F"/><ellipse cx="50" cy="36" rx="3.4" ry="4" fill="#3A342F"/><path d="M33 50 Q40 55 47 50" fill="none" stroke="#3A342F" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <h1>XBot</h1>
    <label class="field">
      <span>登录 token</span>
      <input id="token" name="token" type="password" autocomplete="current-password" required>
    </label>
    <p id="login-error" class="error" hidden></p>
    <button class="primary" type="submit">进入</button>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="side-scroll">
      <div id="pin-row" class="pin-row"></div>
      <nav id="roster" class="list" aria-label="Bot"></nav>
    </div>
    <div class="side-foot">
      <div class="me">
        <span id="me-avatar"></span>
        <span id="me-name" class="me-name">我</span>
        <span class="spacer"></span>
        <button id="theme" class="icon-btn" type="button" aria-label="外观" data-tip="外观">
          <svg id="theme-icon" class="icon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
      <div class="connect-wrap">
        <button id="connect" class="connect-pill" type="button" aria-expanded="false">
          <svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span>连接应用</span>
        </button>
        <div id="connect-pop" class="pop connect-pop" hidden>
          <div class="connect-row">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><path d="M12 19h8"/></svg>
            <span class="name">终端</span>
            <span class="status"><i class="status-dot ok"></i>已启用</span>
          </div>
          <div class="connect-row">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
            <span class="name">浏览器</span>
            <span class="status"><i class="status-dot off"></i>未连接</span>
          </div>
          <div class="connect-row">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
            <span class="name">桌面</span>
            <span class="status"><i class="status-dot off"></i>未连接</span>
          </div>
          <div class="connect-row">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a6 6 0 0 1-12 0V8Z"/></svg>
            <span class="name">MCP</span>
            <span class="status"><i class="status-dot off"></i>未连接</span>
          </div>
          <button id="phone-push" class="connect-row" type="button" role="switch" aria-checked="false" aria-label="手机推送">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>
            <span class="name">手机推送</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <p id="phone-push-hint" class="push-hint" hidden>免打扰时段不推送</p>
          <div class="connect-sep" role="separator"></div>
          <button id="logout" type="button">退出</button>
          <button id="collapse" class="desk-only" type="button">收起列表</button>
        </div>
      </div>
    </div>
  </aside>
  <div id="backdrop" class="backdrop" hidden></div>

  <main class="main">
    <header class="top">
      <div class="top-inner">
        <button id="menu" class="icon-btn mobile-only" type="button" aria-label="列表" data-tip="列表">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
        </button>
        <button id="back" class="icon-btn" type="button" aria-label="返回" data-tip="返回" hidden>
          <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="top-title">
          <div id="title" class="title">XBot</div>
          <div id="subtitle" class="subtitle" hidden></div>
        </div>
        <button id="bell" class="icon-btn" type="button" aria-label="通知" data-tip="通知">
          <svg class="icon" viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
          <i id="bell-dot" class="dot" hidden></i>
        </button>
        <div id="notes" class="notes" hidden></div>
        <div class="more-wrap">
          <button id="more" class="icon-btn" type="button" aria-label="更多" data-tip="更多" aria-expanded="false" hidden>
            <svg class="icon" viewBox="0 0 24 24"><circle class="solid" cx="5" cy="12" r="1.5"/><circle class="solid" cx="12" cy="12" r="1.5"/><circle class="solid" cx="19" cy="12" r="1.5"/></svg>
          </button>
          <div id="more-menu" class="pop more-pop" hidden>
            <button id="export-chat" type="button">导出对话</button>
          </div>
        </div>
        <button id="info" class="icon-btn" type="button" aria-label="详情" data-tip="详情" aria-expanded="false">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </button>
      </div>
    </header>
    <div id="node-pending" class="node-pending" hidden></div>
    <div id="thread" class="thread"></div>
    <div class="dock">
      <form id="composer" class="composer">
        <div id="quote-bar" class="quote-row" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
          <p id="quote-bar-text" class="quote-row-text"></p>
          <button id="quote-clear" class="ghost" type="button" aria-label="取消引用" data-tip="取消">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="plus-wrap">
          <button id="plus" class="icon-btn" type="button" aria-label="更多" data-tip="更多" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
          <div id="plus-menu" class="pop plus-pop" hidden>
            <button type="button" disabled>附件</button>
          </div>
        </div>
        <textarea id="input" rows="1" placeholder="写一条消息" maxlength="16000"></textarea>
        <div class="composer-actions">
          <button id="mic" class="icon-btn" type="button" disabled data-tip="语音" aria-label="语音">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
          </button>
          <button id="send" class="send" type="submit" aria-label="发送" data-tip="发送">
            <svg class="icon" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <aside id="panel" class="panel" aria-label="详情">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="panel-bar">
      <div class="panel-more-wrap">
        <button id="panel-more" class="ghost" type="button" aria-label="更多" data-tip="更多" aria-expanded="false" hidden>
          <svg class="icon" viewBox="0 0 24 24"><circle class="solid" cx="5" cy="12" r="1.5"/><circle class="solid" cx="12" cy="12" r="1.5"/><circle class="solid" cx="19" cy="12" r="1.5"/></svg>
        </button>
        <div id="panel-menu" class="pop panel-menu" hidden></div>
      </div>
      <button id="panel-export" class="ghost" type="button" aria-label="导出" data-tip="导出" hidden>
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
      </button>
      <button id="panel-close" class="ghost" type="button" aria-label="关闭" data-tip="关闭">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </aside>
</div>

<div id="modal" class="modal" hidden>
  <form id="modal-form" class="modal-card">
    <h2 id="modal-title">新建</h2>
    <div id="modal-fields"></div>
    <p id="modal-error" class="error" hidden></p>
    <div class="modal-actions">
      <button class="secondary" type="button" id="modal-cancel">取消</button>
      <button class="primary" type="submit" id="modal-ok">创建</button>
    </div>
  </form>
</div>
<div id="lightbox" class="lightbox" hidden></div>
<script src="/app.js"></script>
</body>
</html>
