<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="theme-color">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
try {
  var t = localStorage.getItem("xbot-theme");
  if (t !== "light" && t !== "dark") {
    t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
  var m = document.getElementById("theme-color");
  if (m) m.setAttribute("content", t === "dark" ? "#161618" : "#ffffff");
} catch (e) {}
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>XBot</title>
<link rel="preload" href="/fonts/MonaSansVF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/NotoSansSC-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/devices.css">
<link rel="stylesheet" href="/remotechat.css">
</head>
<body>

</defs></svg>
<div id="login" class="gate">
  <form id="login-form" class="gate-card" novalidate>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 100 100"><path d="M16 20 L40 50 L16 80 M84 20 L60 50 L84 80" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>XBot</h1>
    <label class="field">
      <span>登录码</span>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus aria-describedby="login-hint">
    </label>
    <p id="login-hint" class="hint">启动 XBot 时，终端里会打印登录码</p>
    <p id="login-notice" class="hint" role="status" hidden></p>
    <p id="login-error" class="error" hidden></p>
    <button class="primary" type="submit">进入</button>
  </form>
</div>

<div id="setup" class="gate" hidden>
  <form id="setup-form" class="gate-card" novalidate>
    <h1>先填模型密钥</h1>
    <p class="hint">XBot 默认用 DeepSeek：在 platform.deepseek.com 创建一个 API key，整段粘贴到这里。</p>
    <label class="field">
      <span>API key</span>
      <input id="setup-key" name="key" type="password" autocomplete="off" spellcheck="false" required aria-describedby="setup-hint">
    </label>
    <p id="setup-hint" class="hint">会先向 <span id="setup-host">模型服务</span> 发一个请求试一下。密钥只存在这台电脑的 XBot 数据目录里，只有你的账户能读，不会写进系统环境变量。</p>
    <p id="setup-error" class="error" role="alert" hidden></p>
    <button id="setup-save" class="primary" type="submit" disabled>测试并保存</button>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="side-drag" aria-hidden="true"></div>
    <div id="side-grip" class="sgrip" aria-hidden="true"></div>
    <div class="side-scroll">
      <div id="greeting" class="greeting" aria-live="polite"></div>
      <div id="pin-row" class="pin-row"></div>
      <nav id="roster" class="list" aria-label="Bot"></nav>
      <nav id="remote-roster" class="list g7-remote" aria-label="其他电脑上的 Bot" hidden></nav>
    </div>
    <div class="side-foot">
      <button id="rail-new" class="railnew" type="button" aria-label="新建 Bot 或群组" data-tip="新建" data-tip-placement="right"></button>
      <!-- Only 我 at the bottom: the owner and this computer's name. 设备,
           连接应用, 外观 and 收起列表 are in its menu (device prototype v2, item 15). -->
      <div class="account-wrap">
        <button id="account" class="account-trigger" type="button" aria-label="我" aria-expanded="false" aria-controls="account-menu">
          <span id="me-avatar"></span>
          <span class="me-text"><span id="me-name" class="me-name">我</span><span id="me-device" class="me-device" hidden></span></span>
          <svg class="icon me-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
        </button>
        <div id="account-menu" class="pop account-menu" hidden>
          <button id="account-devices" type="button">设备<span id="account-devices-count" class="menu-count"></span></button>
          <button id="account-connect" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="connect-pop">连接应用</button>
          <button id="account-theme" type="button">外观</button>
          <button id="collapse" class="desk-only" type="button">收起列表</button>
          <button id="logout" type="button">退出</button>
          <div class="pop-row account-about"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span>关于 XBot</span><span id="account-version" class="menu-count"></span></div>
        </div>
        <div id="connect-pop" class="pop connect-pop" hidden>
          <div class="connect-row">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><path d="M12 19h8"/></svg>
            <span class="name">终端</span>
            <span class="status"><i class="status-dot ok"></i>已启用</span>
          </div>
          <div class="connect-row">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
            <span class="name">浏览器</span>
            <span class="status"><i class="status-dot off"></i>未连接</span>
          </div>
          <div class="connect-row">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
            <span class="name">桌面</span>
            <span class="status"><i class="status-dot off"></i>未连接</span>
          </div>
          <div class="connect-row">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a6 6 0 0 1-12 0V8Z"/></svg>
            <span class="name">MCP</span>
            <span class="status"><i class="status-dot off"></i>未连接</span>
          </div>
          <button id="phone-push" class="connect-row" type="button" role="switch" aria-checked="false" aria-label="手机推送">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>
            <span class="name">手机推送</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <p id="phone-push-hint" class="push-hint" hidden>免打扰时段不推送</p>
        </div>
      </div>
    </div>
  </aside>
  <div id="backdrop" class="backdrop" hidden></div>

  <main class="main">
   <div class="chat">
    <header class="top">
      <div class="top-inner">
        <button id="menu" class="icon-btn mobile-only" type="button" aria-label="列表" data-tip="列表">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
        </button>
        <button id="back" class="icon-btn" type="button" aria-label="返回" data-tip="返回" hidden>
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <div class="top-title">
          <div id="title" class="title">XBot</div>
          <div id="subtitle" class="subtitle" hidden></div>
        </div>
        <!-- Shown once a newer version is downloaded: a click installs it and
             starts XBot again. Nothing appears while it downloads in the
             background, and nothing at all when there is no update. -->
        <button id="update" class="update-btn" type="button" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg>
          <span class="update-label">更新</span>
        </button>
      </div>
    </header>
    <div id="thread" class="thread"></div>
    <!-- The exchange between two bots is read-only: this replaces the composer. -->
    <div class="peer-dock"><button id="peer-close" class="peer-close secondary" type="button">关闭聊天</button></div>
    <div class="dock">
      <div id="work-status" class="work-status"></div>
      <form id="composer" class="composer">
        <div id="quote-bar" class="quote-row" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
          <p id="quote-bar-text" class="quote-row-text"></p>
          <button id="quote-clear" class="ghost" type="button" aria-label="取消引用" data-tip="取消">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <!-- Pictures pasted or dropped into the composer wait here until send. -->
        <div id="attach-bar" class="attach-row" hidden>
          <div id="attach-list" class="attach-list" aria-label="待发送的图片"></div>
          <p id="attach-note" class="attach-note" hidden></p>
        </div>
        <textarea id="input" rows="1" placeholder="写一条消息" maxlength="16000"></textarea>
        <div class="composer-actions">
          <button id="send" class="send secondary" disabled type="submit" aria-label="发送" data-tip="发送">
            <svg class="icon" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
          </button>
        </div>
      </form>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
   </div>
    <div id="panel-scrim" class="panel-scrim" hidden></div>
    <aside id="panel" class="panel" aria-label="详情">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="panel-bar">
        <!-- The header's former "···" actions, filled in by syncPanelChrome(). -->
        <div id="panel-actions" class="panel-actions" role="toolbar" aria-label="Bot 操作" hidden></div>
      </div>
      <div id="panel-head" class="panel-head">
        <div id="panel-ident" class="pid" hidden></div>
        <div id="ctxbar" hidden></div>
        <div id="panel-tabs" class="panel-tabs"></div>
      </div>
      <div id="panel-body" class="panel-body"></div>
    </aside>
    <!-- One control stays at the card's outer edge in both panel states. -->
    <button id="info" class="icon-btn ptog" type="button" aria-label="详情" data-tip="详情" aria-expanded="false">
      <svg class="icon" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
    </button>
  </main>

</div>

<div id="modal" class="modal" hidden>
  <form id="modal-form" class="modal-card" novalidate>
    <h2 id="modal-title">新建</h2>
    <div id="modal-fields"></div>
    <p id="modal-error" class="error" hidden></p>
    <div class="modal-actions">
      <button class="secondary" type="button" id="modal-cancel">取消</button>
      <button class="primary" type="submit" id="modal-ok">创建</button>
    </div>
  </form>
</div>
<div id="lightbox" class="lightbox" hidden></div>
<script src="/vendor/xbot-avatar.min.js"></script>
<script src="/app.js"></script>
<script src="/devices.js"></script>
<script src="/pairing.js"></script>
<script src="/remotechat.js"></script>
</body>
</html>
